<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mixed | Skogsglöd AB</title>
    <link rel="icon" type="image/png" href="/Symbol.png">
    
    <style>
        body, html {
            margin: 0; padding: 0; min-height: 100%;
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: #0b0b0b; color: #f0f0f0;
        }
        .bg-image {
            background-image: url('/background.jpg'); 
            min-height: 100vh;
            background-position: center;
            background-repeat: no-repeat; 
            background-size: cover;
            background-attachment: fixed;
            position: relative;
        }
        .overlay {
            min-height: 100vh;
            width: 100%;
            background: rgba(0, 0, 0, 0.75);
            display: flex; 
            flex-direction: column;
            justify-content: center; 
            align-items: center;
            text-align: center; 
            padding: 40px 20px; 
            box-sizing: border-box;
        }
        
        .container { 
            max-width: 700px; 
            width: 100%; 
            animation: fadeIn 1.2s ease-in; 
        }
        
        .logo { 
            max-width: 320px; 
            width: 80%; 
            height: auto; 
            margin-bottom: 35px;
            transition: opacity 0.2s ease;
        }
        .logo:hover {
            opacity: 0.85;
        }
        
        h2 {
            font-size: 1.1rem; 
            letter-spacing: 3px; 
            text-transform: uppercase;
            font-weight: 300; 
            color: #d4af37; 
            margin-top: 0; 
            margin-bottom: 12px;
        }
        .desc {
            font-size: 0.95rem; 
            line-height: 1.6; 
            color: #bbb; 
            margin-bottom: 35px;
        }
        
        /* Lista över filer */
        .file-list {
            list-style: none;
            padding: 0;
            margin: 0 auto 35px auto;
            max-width: 550px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        
        .file-item a {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 20px;
            background: rgba(20, 20, 20, 0.65);
            border: 1px solid rgba(212, 175, 55, 0.3);
            border-radius: 4px;
            color: #f0f0f0;
            text-decoration: none;
            font-size: 0.95rem;
            letter-spacing: 1px;
            text-transform: capitalize;
            transition: all 0.25s ease;
            backdrop-filter: blur(4px);
        }
        
        .file-item a:hover {
            background-color: rgba(212, 175, 55, 0.15);
            border-color: #d4af37;
            color: #fff;
            transform: translateX(4px);
        }

        .file-name {
            text-align: left;
            word-break: break-word;
        }
        
        .file-arrow {
            color: #d4af37;
            font-size: 1.1rem;
            margin-left: 15px;
            transition: transform 0.2s ease;
        }
        .file-item a:hover .file-arrow {
            transform: translateX(4px);
        }

        .status-msg {
            color: #888;
            font-size: 0.95rem;
            padding: 20px;
        }

        .back-link {
            display: inline-block; 
            padding: 10px 24px;
            border: 1px solid #555; 
            color: #aaa;
            text-decoration: none; 
            text-transform: uppercase;
            font-size: 0.75rem; 
            letter-spacing: 2px; 
            transition: all 0.3s ease;
            margin-top: 10px;
        }
        .back-link:hover { 
            border-color: #d4af37; 
            color: #d4af37; 
        }
        
        .footer {
            margin-top: 60px; 
            font-size: 0.75rem; 
            color: #777;
            border-top: 1px solid #333; 
            padding-top: 20px;
            max-width: 450px; 
            margin-left: auto; 
            margin-right: auto;
        }
        
        @keyframes fadeIn { 
            from { opacity: 0; transform: translateY(15px); } 
            to { opacity: 1; transform: translateY(0); } 
        }
        
        @media (max-width: 600px) {
            .logo { max-width: 240px; margin-bottom: 25px; } 
            h2 { font-size: 0.95rem; }
            .file-item a { padding: 12px 16px; font-size: 0.85rem; }
        }
    </style>
</head>
<body>
    <div class="bg-image">
        <div class="overlay">
            <div class="container">
                <a href="/">
                    <img src="/Logo_Ochra.png" alt="Skogsglöd AB" class="logo">
                </a>
                
                <h2>Verktyg & Resurser</h2>
                <p class="desc">Filer och applikationer i mappen /mixed</p>
                
                <ul class="file-list" id="file-list">
                    <li class="status-msg">Läser in filer...</li>
                </ul>

                <div>
                    <a href="/" class="back-link">&larr; Tillbaka till startsidan</a>
                </div>
                
                <div class="footer">
                    &copy; 2026 Skogsglöd AB &bull; Hammerdal, Jämtland
                </div>
            </div>
        </div>
    </div>

    <script>
        const user = 'skogsglod';
        const repo = 'skogsglod-web';
        const folder = 'mixed';

        const listElement = document.getElementById('file-list');

        fetch(`https://api.github.com/repos/${user}/${repo}/contents/${folder}`)
            .then(res => {
                if (!res.ok) {
                    throw new Error(`GitHub API svarade med status ${res.status}`);
                }
                return res.json();
            })
            .then(data => {
                listElement.innerHTML = '';

                // Filtrera bort index.html och eventuella dolda systemfiler
                const files = data.filter(item => 
                    item.type === 'file' && 
                    item.name.toLowerCase() !== 'index.html' && 
                    !item.name.startsWith('.')
                );

                if (files.length === 0) {
                    listElement.innerHTML = '<li class="status-msg">Inga filer hittades i mappen.</li>';
                    return;
                }

                files.forEach(file => {
                    const li = document.createElement('li');
                    li.className = 'file-item';

                    const a = document.createElement('a');
                    a.href = file.name;

                    // Gör filnamnet mer lättläst (tar bort .html och byter _ till mellanslag)
                    const cleanName = file.name
                        .replace(/\.[^/.]+$/, "")
                        .replace(/[_-]/g, ' ');

                    a.innerHTML = `
                        <span class="file-name">${cleanName}</span>
                        <span class="file-arrow">&rarr;</span>
                    `;

                    li.appendChild(a);
                    listElement.appendChild(li);
                });
            })
            .catch(err => {
                console.error('Kunde inte läsa in filerna:', err);
                listElement.innerHTML = `
                    <li class="status-msg">
                        Kunde inte hämta filer automatiskt.<br>
                        <small style="color: #666; display: block; margin-top: 6px;">Kontrollera att mappen mixed och dina filer är pushade till GitHub.</small>
                    </li>
                `;
            });
    </script>
</body>
</html>
